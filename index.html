<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8"/>
	<!-- SVG app icon; the .ico is only a fallback for browsers without SVG favicon support.
	     The PNGs/.ico are generated from favicon.svg by `npm run icons`. -->
	<link rel="icon" href="/favicon.ico" sizes="32x32"/>
	<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
	<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
	<link rel="manifest" href="/manifest.webmanifest"/>
	<meta name="theme-color" content="#06101c"/>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400..800;1,6..12,400..800&display=swap" rel="stylesheet">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
	<title>ZemaKing Diecast Collection</title>
	<script>
		(function () {
			try {
				var stored = localStorage.getItem("zk-theme");
				var theme = stored === "light" || stored === "dark"
					? stored
					: (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
				document.documentElement.dataset.theme = theme;
			} catch (e) {
				document.documentElement.dataset.theme = "dark";
			}
		})();
	</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
