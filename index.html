<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8"/>
	<!-- SVG app icon; the .ico is only a fallback for browsers without SVG favicon support.
	     The PNGs/.ico are generated from favicon.svg by `npm run icons`. -->
	<link rel="icon" href="/favicon.ico" sizes="32x32"/>
	<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
	<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
	<link rel="manifest" href="/manifest.webmanifest"/>
	<meta name="theme-color" content="#06101c"/>
	<!-- Phase 33: open the Supabase connections while the JS downloads — the summary list (REST,
	     CORS → the crossorigin pool) and the photos (Storage, plain <img> → the other pool) come
	     next on every page. Nunito Sans is self-hosted (main.tsx) and deliberately not preloaded:
	     on a slow connection the preload competed with the JS and cost ~140 ms of first paint, for no
	     layout-shift gain (docs/performance.md). -->
	<link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin>
	<link rel="preconnect" href="%VITE_SUPABASE_URL%">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
	<title>ZemaKing Diecast Collection</title>
	<script>
		(function () {
			try {
				var stored = localStorage.getItem("zk-theme");
				var theme = stored === "light" || stored === "dark"
					? stored
					: (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
				document.documentElement.dataset.theme = theme;
			} catch (e) {
				document.documentElement.dataset.theme = "dark";
			}
		})();
	</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
